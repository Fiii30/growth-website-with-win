<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Community</title>
        <link rel="stylesheet" href="../assets/css/style_comm.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <div class="container-navbar">
                <img id="logo" src="https://ik.imagekit.io/zlt25mb52fx/assets/images/logo/honda.svg" alt="Honda Logo" width="100">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="nav-links">
                        <a href="../index.html">Home</a>
                        <a href="#">About</a>
                        <a class="links-disabled" href="#">Community</a>
                        <a href="#footer">Contact</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-content">
            <div class="form-card">
                <p>Massage to Community</p>
                <form id="formcommunity">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>

                    <button type="submit">Submit</button>
                </form>
            </div>
            
            <div class="content">
                <p>Community Live Chat</p>
                <div class="live-chat">
                    <div class="chat-user" id="chat-user">
                        <!-- ada di javascript -> community.js -->
                    </div>
                </div>
            </div>
        </div>

        <footer id="footer">
            <p>Contact Us</p>
            <div class="contact">
                <a href=""><img class="contact-img" src="../assets/image/github.png" alt="" srcset=""></a>
                <a href=""><img class="contact-img" src="../assets/image/twitter.png" alt="" srcset=""></a>
                <a href=""><img class="contact-img" src="../assets/image/instagram.png" alt="" srcset=""></a>
            </div>
            
            <p>&copy; 2024 Honda Win 100 by Wafi. All rights reserved.</p>
        </footer>
        
        <script src="../assets/js/community.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
